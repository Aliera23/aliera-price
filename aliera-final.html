<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALIERA — Калькулятор доставки</title>
<style>
:root{
  --bg-gradient:radial-gradient(ellipse at 50% 20%,#0a1545 0%,#050a28 40%,#02030f 100%);
  --panel-bg:rgba(8,14,45,0.72);
  --panel-border:rgba(0,220,255,0.28);
  --text-main:#ffffff;
  --text-muted:#8ba0d8;
  --neon-cyan:#00e8ff;
  --neon-purple:#c020ff;
  --neon-green:#00ff88;
  --neon-red:#ff3366;
  --neon-pink:#ff3d9a;
  --glow-cyan:0 0 18px rgba(0,232,255,0.45),0 0 40px rgba(0,180,255,0.15);
  --glow-purple:0 0 18px rgba(192,32,255,0.5),0 0 40px rgba(160,0,255,0.18);
  --glow-green:0 0 15px rgba(0,255,136,0.4);
  --radius:18px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
body{
  background:#02030f;background-image:var(--bg-gradient);
  color:var(--text-main);min-height:100vh;overflow-x:hidden;
}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(90deg,transparent 97%,rgba(0,180,255,0.035) 97.5%),
    linear-gradient(transparent 97%,rgba(0,220,255,0.03) 97.5%);
  background-size:55px 55px;
}
.app{
  position:relative;z-index:1;
  display:grid;grid-template-columns:1fr 380px;gap:18px;
  max-width:1480px;margin:0 auto;padding:18px;
}

/* GLASS PANEL - matching image */
.gp{
  background:var(--panel-bg);
  backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--panel-border);
  border-radius:var(--radius);padding:18px 20px;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.55),
    0 0 0 1px rgba(0,200,255,0.08),
    inset 0 1px 0 rgba(255,255,255,0.06),
    0 0 25px rgba(0,160,255,0.06);
  position:relative;overflow:hidden;
}
.gp::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,230,255,0.55),transparent);
}
.gp.glow-strong{
  box-shadow:
    0 8px 32px rgba(0,0,0,0.55),
    0 0 25px rgba(0,180,255,0.18),
    0 0 50px rgba(0,140,255,0.08),
    inset 0 1px 0 rgba(255,255,255,0.06);
}

.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ph h3{font-size:1.1rem;font-weight:600;letter-spacing:0.5px}
.xb{color:var(--text-muted);cursor:pointer;font-size:.9rem;background:none;border:none;transition:color .2s}
.xb:hover{color:#fff}

/* HEADER */
.header{
  grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;
  padding:16px 25px;
  background:linear-gradient(135deg,rgba(6,11,40,0.8),rgba(3,4,22,0.9));
  backdrop-filter:blur(20px);border:1px solid var(--panel-border);border-radius:var(--radius);
  box-shadow:0 0 30px rgba(0,100,255,0.12),0 0 60px rgba(0,100,255,0.04);
  position:relative;overflow:hidden;
}
.header::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent 30%,rgba(0,240,255,0.03) 50%,transparent 70%);
  background-size:200% 100%;animation:shimmer 8s linear infinite;
}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.h-left{display:flex;align-items:center;gap:14px}
.logo-img{height:50px;filter:drop-shadow(0 0 12px rgba(255,140,0,0.3))}
.brand .bname{
  font-size:1.8rem;font-weight:800;letter-spacing:2px;
  background:linear-gradient(90deg,var(--neon-cyan),#fff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 8px rgba(0,240,255,0.3));line-height:1;
}
.brand .bsub{font-size:.65rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-top:2px}
.h-center h1{font-size:1.8rem;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.h-center p{font-size:.9rem;color:var(--text-muted)}

/* MATERIALS */
.materials{grid-column:1;grid-row:2}
.mat-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:16px}
.mat-card{
  background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.09);
  border-radius:14px;padding:11px 5px;text-align:center;cursor:pointer;
  transition:all .28s cubic-bezier(.25,.8,.25,1);
  display:flex;flex-direction:column;align-items:center;gap:9px;
}
.mat-card .mic{
  width:46px;height:46px;background:rgba(255,255,255,0.06);
  border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:1.45rem;
  box-shadow:inset 0 0 12px rgba(0,0,0,0.25);overflow:hidden;
}
.mat-card .mic img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.mat-card span{font-size:.76rem;font-weight:500;color:var(--text-muted)}
.mat-card:hover{border-color:rgba(0,220,255,0.35);background:rgba(0,200,255,0.04);transform:translateY(-1px)}
.mat-card.active{
  border-color:var(--neon-purple);
  box-shadow:var(--glow-purple),inset 0 0 20px rgba(180,0,255,0.08);
  background:linear-gradient(180deg,rgba(180,20,255,0.22),rgba(8,12,40,0.7));
}
.mat-card.active span{color:#fff;text-shadow:0 0 8px rgba(200,100,255,0.4)}
.mat-card.active .mic{background:rgba(180,40,255,0.18);box-shadow:0 0 12px rgba(180,0,255,0.25)}

.search-row{display:flex;gap:12px}
.si-wrap{flex:1;position:relative}
.si-wrap input{
  width:100%;background:rgba(0,0,0,0.3);border:1px solid rgba(0,240,255,0.15);
  border-radius:10px;padding:12px 16px 12px 42px;color:#fff;font-size:.9rem;outline:none;
}
.si-wrap input:focus{border-color:var(--neon-cyan);box-shadow:0 0 8px rgba(0,240,255,0.1)}
.si-wrap input::placeholder{color:rgba(143,160,221,0.5)}
.si-wrap::before{content:"🔍";position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.6}
.filter-btn{
  background:rgba(0,240,255,0.05);border:1px solid rgba(0,240,255,0.2);color:#fff;
  border-radius:10px;padding:0 20px;font-size:.9rem;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}

.prod-list{
  max-height:0;overflow:hidden;transition:max-height .3s;
  border-radius:10px;background:rgba(3,3,28,0.5);margin-top:0;
}
.prod-list.open{max-height:160px;overflow-y:auto;border:1px solid rgba(0,240,255,0.1);margin-top:12px}
.prod-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 14px;border-bottom:1px solid rgba(0,240,255,0.06);
  cursor:pointer;font-size:.82rem;transition:background .15s;
}
.prod-row:last-child{border-bottom:none}
.prod-row:hover{background:rgba(0,240,255,0.06)}
.prod-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-meta{font-size:.72rem;color:var(--neon-cyan);white-space:nowrap;margin-left:10px}

/* VEHICLES */
.vehicles{grid-column:1;grid-row:3}
.fleet-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.truck-card{
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;padding:13px 10px;cursor:pointer;transition:all .28s;text-align:center;
}
.truck-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,0.35);border-color:rgba(0,200,255,0.25)}
.truck-img-box{
  height:78px;background:rgba(0,20,50,0.35);border-radius:12px;margin-bottom:11px;
  display:flex;justify-content:center;align-items:center;overflow:hidden;
  border:1px solid rgba(0,180,255,0.08);
}
.truck-img-box img{max-width:90%;max-height:90%;object-fit:contain}
.truck-svg{width:68px;height:42px}
.truck-name{font-size:.93rem;font-weight:600;margin-bottom:2px}
.truck-limit{font-size:.76rem;color:var(--text-muted);margin-bottom:7px}
.truck-rate{font-size:1.02rem;font-weight:700;color:var(--neon-cyan);text-shadow:0 0 10px rgba(0,230,255,0.35)}

.truck-card.active{
  border-color:var(--neon-cyan);
  box-shadow:var(--glow-cyan),inset 0 0 25px rgba(0,200,255,0.06);
  background:linear-gradient(180deg,rgba(0,220,255,0.14),rgba(6,12,40,0.7));
}
@keyframes neonPulse{
  0%,100%{box-shadow:0 0 16px rgba(0,230,255,0.2),0 0 30px rgba(0,180,255,0.08)}
  50%{box-shadow:0 0 28px rgba(0,230,255,0.4),0 0 55px rgba(0,180,255,0.15)}
}
.truck-card.active{animation:neonPulse 2.8s ease-in-out infinite}

/* VISUALIZATION BLOCK */
.viz-block{grid-column:1;grid-row:4}
.viz-content{display:grid;grid-template-columns:1fr 300px;gap:25px;align-items:start}
.scene-3d{
  height:220px;background:rgba(0,0,0,0.4);
  border:1px dashed rgba(0,240,255,0.2);border-radius:14px;
  position:relative;overflow:hidden;
}
#truckCanvas{width:100%;height:100%;display:block}

.load-stats h3{font-size:1.05rem;font-weight:600;margin-bottom:16px}
.pm-row{margin-bottom:14px}
.pm-labels{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:6px}
.pm-name{color:var(--text-muted);display:flex;align-items:center;gap:6px}
.pm-val{font-weight:600}
.pm-pct{font-size:1.05rem;font-weight:800;margin-left:8px}
.pm-pct.cyan{color:var(--neon-cyan)}.pm-pct.purple{color:var(--neon-purple)}.pm-pct.green{color:var(--neon-green)}
.pm-pct.warn{color:#ffc107}.pm-pct.over{color:#ff1744}
.pb-track{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;flex:1}
.pb-fill{height:100%;border-radius:4px;transition:width .4s}
.pb-fill.cyan{background:linear-gradient(90deg,#006aff,var(--neon-cyan));box-shadow:0 0 8px rgba(0,240,255,0.5)}
.pb-fill.purple{background:linear-gradient(90deg,#6a00ff,var(--neon-purple));box-shadow:0 0 8px rgba(189,0,255,0.5)}
.pb-fill.green{background:linear-gradient(90deg,#009944,var(--neon-green));box-shadow:0 0 8px rgba(0,255,102,0.5)}
.pb-fill.warn{background:linear-gradient(90deg,#ff8c00,#ffc107)!important;box-shadow:0 0 8px rgba(255,193,7,0.4)!important}
.pb-fill.over{background:linear-gradient(90deg,#ff1744,#d50000)!important;box-shadow:0 0 8px rgba(255,23,68,0.4)!important}

.badges-row{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:16px}
.badge-w{
  border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;
}
.badge-w.cyan-w{background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.15)}
.badge-w.green-w{background:rgba(0,255,102,0.03);border:1px solid rgba(0,255,102,0.15)}
.badge-w.purple-w{background:rgba(189,0,255,0.03);border:1px solid rgba(189,0,255,0.15)}
.badge-circle{
  width:42px;height:42px;border-radius:50%;display:flex;justify-content:center;align-items:center;
  font-size:1.1rem;flex-shrink:0;
}
.bc-cyan{background:rgba(0,240,255,0.1);border:1px solid var(--neon-cyan);box-shadow:0 0 10px rgba(0,240,255,0.2)}
.bc-purple{background:rgba(189,0,255,0.1);border:1px solid var(--neon-purple);box-shadow:0 0 10px rgba(189,0,255,0.2)}
.bc-green{background:rgba(0,255,102,0.1);border:1px solid var(--neon-green);box-shadow:0 0 10px rgba(0,255,102,0.2)}
.badge-info h4{font-size:1.15rem;font-weight:700;line-height:1.1}
.badge-info p{font-size:.78rem;color:var(--text-muted)}

.warn-box{padding:8px 12px;border-radius:8px;margin-bottom:8px;font-size:.8rem;display:flex;align-items:center;gap:6px;
  background:rgba(255,23,68,0.08);color:#ff5252;border:1px solid rgba(255,23,68,0.15)}

/* SIDEBAR */
.sidebar{grid-column:2;grid-row:2/5;display:flex;flex-direction:column;gap:20px}

/* Distance */
.dist-panel{display:flex;justify-content:space-between;align-items:center;padding:14px 20px}
.dist-lbl{display:flex;align-items:center;gap:8px;font-weight:500;font-size:.95rem}
.dist-lbl .pin{font-size:1.3rem;color:var(--neon-cyan);filter:drop-shadow(0 0 6px var(--neon-cyan))}
.dist-inp{
  display:flex;align-items:center;
  background:rgba(0,0,0,0.3);border:1px solid rgba(0,240,255,0.2);border-radius:8px;padding:6px 12px;
}
.dist-inp input{
  background:none;border:none;color:#fff;width:70px;font-size:1.3rem;font-weight:700;
  text-align:right;outline:none;margin-right:6px;
}
.dist-inp span{color:var(--text-muted);font-size:.85rem}

/* Order */
.order-tag{
  padding:3px 10px;border-radius:8px;
  background:rgba(189,0,255,0.12);color:var(--neon-purple);font-size:.8rem;font-weight:600;
}
.cart-list{display:flex;flex-direction:column;gap:10px;max-height:220px;overflow-y:auto;padding-right:4px}
.cart-row{
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);
  border-radius:10px;padding:10px;
}
.cr-left{display:flex;align-items:center;gap:10px}
.cr-icon{
  width:36px;height:36px;background:rgba(255,255,255,0.05);border-radius:6px;
  display:flex;justify-content:center;align-items:center;font-size:1.1rem;flex-shrink:0;
}
.cr-info h4{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.cr-info p{font-size:.72rem;color:var(--text-muted)}
.cr-right{display:flex;align-items:center;gap:10px}
.counter{
  display:flex;align-items:center;background:rgba(0,0,0,0.2);
  border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:2px;
}
.counter button{
  background:none;border:none;color:#fff;width:24px;height:24px;cursor:pointer;font-size:.9rem;font-weight:600;
}
.counter input{
  width:32px;text-align:center;font-size:.85rem;font-weight:600;color:var(--neon-cyan);
  background:none;border:none;outline:none;
}
.trash-btn{color:var(--neon-red);cursor:pointer;font-size:.95rem;opacity:.8;transition:opacity .2s;background:none;border:none}
.trash-btn:hover{opacity:1}
.empty-msg{padding:24px;text-align:center;color:rgba(143,160,221,0.4);font-size:.85rem}

/* Delivery type */
.del-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.del-btn{
  background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);
  border-radius:12px;padding:16px 10px;text-align:center;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:.85rem;font-weight:500;transition:all .25s;color:#fff;
}
.del-btn:hover{border-color:rgba(0,240,255,0.2)}
.del-btn .di{font-size:1.6rem;display:block;margin-bottom:2px}
.del-btn.act-dir{
  border-color:var(--neon-purple);box-shadow:var(--glow-purple);
  background:linear-gradient(180deg,rgba(180,20,255,0.16),transparent);
}
.del-btn.act-sh{
  border-color:var(--neon-cyan);box-shadow:var(--glow-cyan);
  background:linear-gradient(180deg,rgba(0,220,255,0.12),transparent);
}

/* Cost */
.totals-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.price-box{
  background:rgba(0,8,30,0.4);border:1px solid rgba(255,255,255,0.06);
  border-radius:13px;padding:11px;text-align:center;
}
.price-box .plbl{font-size:.7rem;color:var(--text-muted);margin-bottom:4px;line-height:1.3}
.price-box .pval{font-size:1.32rem;font-weight:800}
.price-box.hl{border-color:rgba(0,220,255,0.4);background:rgba(0,200,255,0.04)}
.price-box.hl .pval{color:var(--neon-cyan);text-shadow:0 0 14px rgba(0,230,255,0.4)}
.price-box.hl2{border-color:rgba(180,20,255,0.4);background:rgba(180,20,255,0.04)}
.price-box.hl2 .pval{color:var(--neon-purple);text-shadow:0 0 14px rgba(190,40,255,0.4)}
@keyframes costPulse{0%,100%{text-shadow:0 0 12px currentColor}50%{text-shadow:0 0 22px currentColor,0 0 35px currentColor}}
.pval{animation:costPulse 3s ease-in-out infinite}

.submit-btn{
  width:100%;background:linear-gradient(90deg,#c020ff 0%,#8b00ff 40%,#00c8ff 100%);
  border:none;color:#fff;padding:15px;border-radius:13px;
  font-size:.93rem;font-weight:700;cursor:pointer;
  display:flex;justify-content:center;align-items:center;gap:10px;
  box-shadow:0 4px 22px rgba(160,0,255,0.35),0 0 30px rgba(0,180,255,0.12);
  transition:all .22s;position:relative;overflow:hidden;
}
.submit-btn:hover{opacity:.95;box-shadow:0 5px 28px rgba(160,0,255,0.45),0 0 40px rgba(0,200,255,0.18);transform:translateY(-1px)}
.submit-btn::after{
  content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
  animation:btnShine 3.5s linear infinite;
}
@keyframes btnShine{0%{left:-100%}100%{left:200%}}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:rgba(0,240,255,0.3);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

@media(max-width:960px){
  .app{grid-template-columns:1fr;gap:14px}
  .sidebar{grid-column:1;grid-row:auto}
  .mat-grid{grid-template-columns:repeat(4,1fr)}
  .fleet-grid{grid-template-columns:repeat(3,1fr)}
  .viz-content{grid-template-columns:1fr}
  .badges-row{grid-template-columns:1fr}
}
@media(max-width:500px){
  .app{padding:10px}
  .mat-grid{grid-template-columns:repeat(3,1fr)}
  .fleet-grid{grid-template-columns:repeat(2,1fr)}
  .h-center h1{font-size:1.3rem}
}
[hidden]{display:none!important}
</style>
<style id="aliera-reference-skin">

body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 7% 47%,#008aff40,transparent 30%),radial-gradient(ellipse at 86% 38%,#3100bd30,transparent 45%),linear-gradient(0deg,#00154122,#03082a15);z-index:0}
body::after{background:linear-gradient(90deg,transparent 99%,#2b82e51a 100%);background-size:140px 100%;opacity:.4}
.app{max-width:1536px;padding:26px 32px 30px;grid-template-columns:minmax(0,1fr) 418px;gap:18px 14px;align-items:start}
.header{grid-column:1;grid-row:1;display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;padding:0;background:none;border:0;border-radius:0;box-shadow:none;overflow:visible;backdrop-filter:none}
.header::after{display:none}
.h-left,.h-center{min-height:116px;border:1px solid #a4c4efbb;border-radius:24px;background:linear-gradient(125deg,#12365a80,#090e4199 67%,#5d137c36);box-shadow:inset 0 0 20px #1652b52b,0 0 14px #188aff24;position:relative}
.h-left{justify-content:center;padding:10px 12px;gap:9px}
.h-left .reference-brand{width:100%;height:89px;object-fit:contain;mix-blend-mode:screen}
.h-center{padding:16px 28px;display:flex;flex-direction:column;justify-content:center}
.h-center h1{font-size:clamp(23px,2.7vw,42px);letter-spacing:-.5px;white-space:nowrap;line-height:1.15;margin-bottom:9px;text-shadow:0 2px 5px #00112d}
.h-center p{font-size:clamp(12px,1.25vw,19px);color:#e4e8f5;white-space:nowrap}
.gp,.gp.glow-strong{border:1px solid #99cfffbc;border-radius:24px;background:radial-gradient(ellipse at 0% 0%,#00b7ed38,transparent 42%),radial-gradient(ellipse at 100% 100%,#13e8ff29,transparent 44%),linear-gradient(118deg,#051d46da,#0a174bd9 65%,#101b55be);box-shadow:inset 0 0 19px #349fff35,inset 0 1px 2px #dcf8ff75,0 0 5px #50cfff6b,0 0 22px #148cff2b,0 12px 30px #00082b60;backdrop-filter:blur(12px);padding:17px 22px}
.gp::before{height:2px;background:linear-gradient(90deg,#00f1ff00,#b6f9ffb0 20%,#9cc5ff20 60%,#dd70ffcc);opacity:.8;pointer-events:none}
.ph{margin-bottom:15px}.ph h3{font-size:25px;letter-spacing:-.4px;font-weight:650;text-shadow:0 2px 3px #001733}
.xb{font-size:19px;color:#9defff;text-shadow:0 0 10px #17e8ff;opacity:.8}
.materials{grid-row:2;padding-bottom:15px}
.mat-grid{gap:10px;margin-bottom:14px}.mat-card{height:130px;border-radius:15px;padding:8px 4px 10px;gap:3px;justify-content:space-between;background:radial-gradient(ellipse at 50% 105%,#006b9866,transparent 70%),linear-gradient(135deg,#1332699c,#051c3eaa);border:1px solid #9dbdedb3;box-shadow:inset 0 0 14px #249ded16,0 3px 8px #00092f55}
.mat-card .mic{width:100%;height:87px;background:none;border-radius:12px;overflow:hidden}.mic img{width:100%;height:100%;object-fit:cover;border-radius:12px;filter:drop-shadow(0 5px 4px #000c24aa)}
.mat-card span{font-size:14px;color:#fff;white-space:nowrap;letter-spacing:-.4px;font-weight:500}
.mat-card.active,.truck-card.active,.del-btn.act-dir{border:1px solid #f4c4ff;background:radial-gradient(ellipse at 100% 110%,#00f1ffce,transparent 46%),radial-gradient(ellipse at 0 0,#e527ffa6,transparent 64%),linear-gradient(125deg,#7517d2,#32107f 60%,#073d85);box-shadow:inset 0 0 6px #fff8,inset 0 0 22px #ca00ff88,0 0 5px #fbabff,0 0 16px #d615ffc9,0 0 27px #a100ff7a;animation:none}
.mat-card.active{box-shadow:inset 0 0 9px #ffcaff,0 0 5px #ffc8ff,0 0 20px #dd13ffb3}
.search-row{gap:15px}.si-wrap input{height:44px;border:1px solid #c6c8ffb3;background:linear-gradient(90deg,#462b9c62,#08264fbb);box-shadow:inset 0 0 14px #256dba40,0 0 8px #7766ff33;border-radius:14px;padding-left:52px;font-size:17px}.si-wrap input::placeholder{color:#c2cbe6;opacity:1}.si-wrap::before{content:'';height:16px;width:16px;border:2px solid #e4edff;border-radius:50%;left:22px;opacity:1}.si-wrap::after{content:'';position:absolute;width:10px;height:2px;background:#e4edff;left:36px;top:29px;transform:rotate(45deg)}
.filter-btn{width:27%;min-width:150px;border-radius:14px;border:1px solid #a9e9ffc9;background:linear-gradient(115deg,#12608b8c,#0b2e54b3 60%,#00cad76b);box-shadow:inset 0 0 15px #06e2ff55,0 0 10px #00e3ff44;font-size:16px;padding:0 17px}.filter-btn option{background:#0b234d;color:white}
.prod-list{background:#061b3be8}.prod-list.open{max-height:230px;border-color:#7cbdff60}.prod-row{font-size:14px;padding:11px 15px}.prod-row:hover{background:#15d9ff20}.prod-meta{color:#a5e9ff}
.vehicles{grid-row:3;padding-top:12px;padding-bottom:17px}.vehicles .ph{margin-bottom:9px}.fleet-grid{gap:12px}.truck-card{padding:9px 13px 13px;text-align:left;border:1px solid #a9d1f5bb;border-radius:16px;background:radial-gradient(ellipse at 0 0,#1978c459,transparent 60%),linear-gradient(135deg,#0b345eaa,#071b3ddd);box-shadow:inset 0 0 18px #42baff22,0 3px 8px #00102a55;min-width:0}
.truck-img-box{height:96px;margin-bottom:6px;background:none;border-radius:9px;overflow:hidden}.truck-img-box img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen}.truck-name{font-size:21px;line-height:1.12;color:#fff}.truck-limit{font-size:15px;color:#c4d5e8;margin:5px 0}.truck-rate{color:#fff;font-size:23px;white-space:nowrap;text-shadow:0 0 7px #27cbff66}
.sidebar{display:contents}.dist-panel{grid-column:2;grid-row:1;min-height:116px;padding:20px 18px;border-color:#a8ffff;box-shadow:inset 0 0 16px #00deff66,0 0 8px #00ecff99,7px 8px 20px #bd16ff44;gap:10px}.dist-lbl{font-size:17px;gap:13px;white-space:nowrap}.dist-lbl .pin{font-size:0;display:block;width:24px;height:30px;border:6px solid #1ee9f1;border-radius:50% 50% 50% 0;transform:rotate(-45deg);filter:drop-shadow(0 0 7px #00edff99)}
.dist-inp{padding:8px 10px;border:1px solid #97c8efa3;background:#071f4d99;box-shadow:inset 0 0 15px #1d6cb533;border-radius:10px}.dist-inp input{font-size:30px;width:94px;text-align:left;margin:0}.dist-inp span{color:#dbeaff;font-size:19px}.dist-inp input::-webkit-inner-spin-button{opacity:.2}
.sidebar>.gp:nth-child(2){grid-column:2;grid-row:2;min-height:264px;padding:21px 14px 14px}.sidebar>.gp:nth-child(3){grid-column:2;grid-row:3;padding:20px 17px;min-height:202px}
.order-tag{background:none;padding:0;color:#eef6ff;font-size:16px;font-weight:400}.cart-list{gap:0;max-height:210px;padding:0;border:1px solid #87c4e5aa;border-radius:15px;background:#041a3b99}.cart-row{border:0;border-bottom:1px solid #5788b33d;border-radius:0;padding:10px 8px;background:none;gap:6px;min-height:66px}.cart-row:last-child{border-bottom:0}.cr-left{gap:9px;min-width:0;flex:1}.cr-icon{width:55px;height:47px;background:none}.cr-icon img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen}.cr-info{min-width:0}.cr-info h4{font-size:12px;max-width:165px;font-weight:500}.cr-info p{font-size:14px;margin-top:5px;color:#c5d6e9}.cr-right{gap:9px}.counter{padding:0;border:1px solid #76afe440;border-radius:9px;background:#1c487780}.counter button{width:24px;height:32px;font-size:21px;color:#b6e0f7}.counter input{width:32px;color:#fff;font-size:18px;background:#0b274d8c;appearance:textfield}.counter input::-webkit-inner-spin-button{display:none}.trash-btn{color:#ff4e73;font-size:19px;text-shadow:0 0 6px #f4347544}
.del-grid{gap:11px}.del-btn{min-height:82px;flex-direction:row;justify-content:center;gap:13px;border:1px solid #b2dcffb3;border-radius:15px;background:linear-gradient(120deg,#0b325abf,#0b2450c9);font-size:16px;box-shadow:inset 0 0 14px #32baf52e}.del-btn .di{font-size:30px;margin:0}.del-btn.act-sh{border-color:#aaffff;background:linear-gradient(120deg,#0068a4,#072448);box-shadow:0 0 15px #00eaff99,inset 0 0 10px #1df5ff66}

const CAT_ICONS={'Все':'🧱','ЭППС':'📦','Техноплекс':'🟧','LOGICPIR':'🟩','Минвата':'📦','Стекловата':'📜','Плёнка':'📜','Сетка':'🔲','Крепёж':'🔩','Монтаж':'🧪','Профиль ПВХ':'📐','Подложка':'🟫','OSB':'🏠','ГКЛ':'⬜','Профили':'📏','Кровля':'🏠'};
const mainCats=['Все','Минвата','ЭППС','ГКЛ','Кровля','Плёнка','Крепёж','Монтаж'];

let activeV=0,activeCat='Все',cart=[],search='',dtype='direct';
const cats=['Все',...new Set(PRODUCTS.map(p=>p.cat))];

function fmt(n,d=0){return n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d})}

function renderCats(){
  document.getElementById('catGrid').innerHTML=mainCats.map(c=>
    `<div class="mat-card${c===activeCat?' active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')"><div class="mic">${CAT_ICONS[c]||'📦'}</div><span>${c}</span></div>`
  ).join('');
  const sel=document.getElementById('catSelect');
  sel.innerHTML=cats.map(c=>`<option${c===activeCat?' selected':''} value="${c}">${c}</option>`).join('');
}
function setCat(c){activeCat=c;renderCats();renderProds()}

function renderFleet(){
  document.getElementById('fleet').innerHTML=VEHICLES.map((v,i)=>{
    let sp=v.tons;
    if(v.maxCbm)sp+=', '+v.maxCbm+' м³';
    return `<div class="truck-card${i===activeV?' active':''}" onclick="setV(${i})"><div class="truck-img-box">${TRUCK_SVG[v.type]||TRUCK_SVG.van}</div><div class="truck-name">${v.name}</div><div class="truck-limit">${sp}</div><div class="truck-rate">${v.rate} ₽/км</div></div>`;
  }).join('');
}
function setV(i){activeV=i;renderFleet();recalc()}

function renderProds(){
  const el=document.getElementById('prodList');
  const q=search.toLowerCase();
  const f=PRODUCTS.filter(p=>{
    if(q&&!p.name.toLowerCase().includes(q)&&!p.cat.toLowerCase().includes(q))return false;
    if(!q&&activeCat!=='Все'&&p.cat!==activeCat)return false;
    return true;
  });
  if(!f.length){el.innerHTML='<div class="empty-msg">Ничего не найдено</div>';el.classList.add('open');return}
  el.innerHTML=f.map(p=>
    `<div class="prod-row" onclick="addCart(${PRODUCTS.indexOf(p)})"><span class="prod-name" title="${p.name}">${p.name}</span><span class="prod-meta">${p.cbm?p.cbm+' м³':''} ${p.weight?p.weight+' кг':''}</span></div>`
  ).join('');
  el.classList.add('open');
}

function addCart(i){
  const p=PRODUCTS[i];const ex=cart.find(c=>c.product.id===p.id);
  if(ex)ex.qty++;else cart.push({product:p,qty:1});
  renderOrder();recalc();
}
function rmCart(i){cart.splice(i,1);renderOrder();recalc()}
function chgQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderOrder();recalc()}
function setQty(i,v){const n=parseInt(v)||0;if(n<=0)cart.splice(i,1);else cart[i].qty=n;renderOrder();recalc()}

function renderOrder(){
  const el=document.getElementById('oList'),cnt=document.getElementById('oCount');
  const t=cart.reduce((s,c)=>s+c.qty,0);
  cnt.textContent=t+' товар'+(t===1?'':(t<5?'а':'ов'));
  if(!cart.length){
    el.innerHTML='<div class="empty-msg">Нажмите на товар, чтобы добавить</div>';
    document.getElementById('costBox').hidden=true;
    document.getElementById('vizBlock').hidden=true;
    return;
  }
  el.innerHTML=cart.map((c,i)=>
    `<div class="cart-row"><div class="cr-left"><div class="cr-icon">${CAT_ICONS[c.product.cat]||'📦'}</div><div class="cr-info"><h4 title="${c.product.name}">${c.product.name}</h4><p>${c.qty} уп.</p></div></div><div class="cr-right"><div class="counter"><button onclick="chgQty(${i},-1)">−</button><input type="number" min="1" value="${c.qty}" onchange="setQty(${i},this.value)"><button onclick="chgQty(${i},1)">+</button></div><button class="trash-btn" onclick="rmCart(${i})">🗑️</button></div></div>`
  ).join('');
}

function setType(t){
  dtype=t;
  document.getElementById('tDirect').className='del-btn'+(t==='direct'?' act-dir':'');
  document.getElementById('tShared').className='del-btn'+(t==='shared'?' act-sh':'');
  recalc();
}

function recalc(){
  if(!cart.length)return;
  const v=VEHICLES[activeV],dist=parseFloat(document.getElementById('distance').value)||0;
  let tCbm=0,tKg=0,tPk=0;
  cart.forEach(c=>{tCbm+=(c.product.cbm||0)*c.qty;tKg+=(c.product.weight||0)*c.qty;tPk+=c.qty});

  const pW=v.maxKg?tKg/v.maxKg*100:0;
  const pV=v.maxCbm?tCbm/v.maxCbm*100:0;

  let w='';
  if(pW>100)w+=`<div class="warn-box">⚠ Вес превышает грузоподъёмность ${v.name}</div>`;
  if(v.maxCbm&&pV>100)w+=`<div class="warn-box">⚠ Объём превышает вместимость ${v.name}</div>`;
  document.getElementById('warnArea').innerHTML=w;

  function bCls(p,base){return p>100?'over':p>80?'warn':base}
  function pCls(p,base){return p>100?'over':p>80?'warn':base}
  let lb='';
  if(v.maxKg)lb+=`<div class="pm-row"><div class="pm-labels"><span class="pm-name">⚖️ Вес</span><span class="pm-val">${fmt(tKg,1)} / ${fmt(v.maxKg)} кг</span></div><div style="display:flex;align-items:center;gap:8px"><div class="pb-track"><div class="pb-fill ${bCls(pW,'cyan')}" style="width:${Math.min(pW,100)}%"></div></div><span class="pm-pct ${pCls(pW,'cyan')}">${Math.round(pW)}%</span></div></div>`;
  if(v.maxCbm)lb+=`<div class="pm-row"><div class="pm-labels"><span class="pm-name">📦 Объём</span><span class="pm-val">${fmt(tCbm,2)} / ${v.maxCbm} м³</span></div><div style="display:flex;align-items:center;gap:8px"><div class="pb-track"><div class="pb-fill ${bCls(pV,'purple')}" style="width:${Math.min(pV,100)}%"></div></div><span class="pm-pct ${pCls(pV,'purple')}">${Math.round(pV)}%</span></div></div>`;
  lb+=`<div class="pm-row"><div class="pm-labels"><span class="pm-name">🪑 Мест</span><span class="pm-val">${tPk}</span></div></div>`;
  document.getElementById('loadBars').innerHTML=lb;

  let bg='';
  bg+=`<div class="badge-w cyan-w"><div class="badge-circle bc-cyan">⚖️</div><div class="badge-info"><h4>${fmt(tKg,1)} кг</h4><p>Загрузка по весу</p></div></div>`;
  bg+=`<div class="badge-w purple-w"><div class="badge-circle bc-purple">📦</div><div class="badge-info"><h4>${fmt(tCbm,2)} м³</h4><p>Загрузка по объёму</p></div></div>`;
  bg+=`<div class="badge-w green-w"><div class="badge-circle bc-green">🔢</div><div class="badge-info"><h4>${tPk}</h4><p>Количество мест</p></div></div>`;
  document.getElementById('badges').innerHTML=bg;
  document.getElementById('vizBlock').hidden=false;

  // Costs
  let minC=4000;if(dist<=5)minC=2000;else if(dist<=20)minC=3500;
  const calcD=v.rate*dist,dirCost=Math.max(calcD,minC);
  let shPct=0;
  if(v.maxCbm&&v.maxKg){const vs=tCbm/v.maxCbm*100,ws=tKg/v.maxKg*100;shPct=Math.max(vs,ws)}
  else if(v.maxKg){shPct=tKg/v.maxKg*100}
  const calcS=Math.round(dirCost*shPct/100),shCost=Math.max(calcS,minC);

  const cc=document.getElementById('costCols');
  const dirHl=dtype==='direct'?'hl':'';
  const shHl=dtype==='shared'?'hl2':'';
  cc.innerHTML=`<div class="price-box ${dirHl}"><p class="plbl">Стоимость<br>Прямой рейс</p><div class="pval">${fmt(dirCost)} ₽</div></div><div class="price-box ${shHl}"><p class="plbl">Стоимость<br>Сборный груз</p><div class="pval">${fmt(shCost)} ₽</div></div>`;
  document.getElementById('costBox').hidden=false;

  draw3D(pV,pW);
}

document.getElementById('searchBox').addEventListener('input',e=>{search=e.target.value.trim();renderProds()});
document.getElementById('catSelect').addEventListener('change',e=>setCat(e.target.value));
document.getElementById('distance').addEventListener('input',recalc);

renderCats();renderFleet();renderProds();renderOrder();

// === 3D TRUCK SCENE ===
function draw3D(pV,pW){
  const c=document.getElementById('truckCanvas'),ctx=c.getContext('2d');
  const r=c.parentElement.getBoundingClientRect();
  c.width=r.width*2;c.height=r.height*2;ctx.scale(2,2);
  const W=r.width,H=r.height;
  ctx.clearRect(0,0,W,H);

  // Neon grid floor
  ctx.save();
  const gy=H*0.72;
  for(let i=-10;i<=10;i++){
    const x=W/2+i*30;
    ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(W/2+(i*60),H);
    ctx.strokeStyle=`rgba(0,240,255,${0.12-Math.abs(i)*0.008})`;ctx.lineWidth=0.5;ctx.stroke();
  }
  for(let j=0;j<8;j++){
    const y=gy+j*((H-gy)/7);
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);
    ctx.strokeStyle=`rgba(0,240,255,${0.1-j*0.01})`;ctx.lineWidth=0.5;ctx.stroke();
  }
  // Glow spot
  const grd=ctx.createRadialGradient(W/2,gy+10,10,W/2,gy+10,120);
  grd.addColorStop(0,'rgba(0,240,255,0.12)');grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;ctx.fillRect(0,gy-20,W,H-gy+20);
  ctx.restore();

  // 3D wireframe truck
  const cx=W/2-40,cy=gy-60;
  const bw=140,bh=55,bd=40;
  ctx.strokeStyle='rgba(0,240,255,0.6)';ctx.lineWidth=1;
  // Back face
  ctx.strokeRect(cx,cy-bh,bw,bh);
  // Top lines to front
  ctx.beginPath();
ctx.moveTo(cx,cy-bh);ctx.lineTo(cx+bd*0.6,cy-bh-bd*0.4);
  ctx.moveTo(cx+bw,cy-bh);ctx.lineTo(cx+bw+bd*0.6,cy-bh-bd*0.4);
  ctx.moveTo(cx+bw,cy);ctx.lineTo(cx+bw+bd*0.6,cy-bd*0.4);
  ctx.stroke();
  // Front face
  ctx.strokeRect(cx+bd*0.6,cy-bh-bd*0.4,bw,bh);
  // Cab
  const cbx=cx+bw+bd*0.6,cby=cy-30;
  ctx.beginPath();
  ctx.rect(cbx+2,cby,40,30-bd*0.4+30);
  ctx.strokeStyle='rgba(0,240,255,0.4)';ctx.stroke();
  // Windshield
  ctx.fillStyle='rgba(0,240,255,0.08)';
  ctx.fillRect(cbx+6,cby+3,32,14);
  ctx.strokeStyle='rgba(0,240,255,0.5)';ctx.strokeRect(cbx+6,cby+3,32,14);

  // Cargo boxes fill based on load
  const fill=Math.max(pV,pW)/100;
  const boxes=Math.floor(fill*12);
  ctx.fillStyle='rgba(189,0,255,0.15)';
  ctx.strokeStyle='rgba(189,0,255,0.4)';ctx.lineWidth=0.7;
  for(let b=0;b<Math.min(boxes,12);b++){
    const col=b%4,row=Math.floor(b/4);
    const bx=cx+5+col*34,by=cy-bh+5+(2-row)*17;
    ctx.fillRect(bx,by,30,14);ctx.strokeRect(bx,by,30,14);
  }

  // Wheels
  ctx.fillStyle='rgba(0,240,255,0.15)';ctx.strokeStyle='rgba(0,240,255,0.5)';ctx.lineWidth=1;
  [cx+20,cx+50,cx+bw+bd*0.6+20].forEach(wx=>{
    ctx.beginPath();ctx.arc(wx,cy+2,7,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.arc(wx,cy+2,2.5,0,Math.PI*2);ctx.fillStyle='rgba(0,240,255,0.6)';ctx.fill();
    ctx.fillStyle='rgba(0,240,255,0.15)';
  });

  // Label
  ctx.font='10px Segoe UI';ctx.fillStyle='rgba(143,160,221,0.5)';ctx.textAlign='center';
  ctx.fillText('3D Визуализация загрузки',W/2,H-8);
}

// === PARTICLES ===
(function(){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');
  let w,h,pts=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
  resize();addEventListener('resize',resize);
  const colors=['0,240,255','74,122,255','189,0,255','255,61,138'];
  for(let i=0;i<45;i++)pts.push({
    x:Math.random()*w,y:Math.random()*h,
    vx:(Math.random()-0.5)*0.2,vy:(Math.random()-0.5)*0.2,
    r:Math.random()*1.6+0.4,ci:Math.floor(Math.random()*4)
  });
  function draw(){
    ctx.clearRect(0,0,w,h);
    pts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${colors[p.ci]},0.5)`;ctx.fill();
    });
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<120){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);
        ctx.strokeStyle=`rgba(0,162,255,${0.06*(1-d/120)})`;ctx.lineWidth=0.4;ctx.stroke()}
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

const skinCats=['Все','Минвата','ЭППС','ГКЛ','Кровля','Плёнка','Крепёж','Монтаж'];
const skinLabels=["Все", "Утеплители", "Пенополистирол", "Гипсокартон", "Кровля", "Плёнки", "Крепёж", "Смеси"];
function skinIcon(cat){let i=skinCats.indexOf(cat);if(i<0)i=cat==='Стекловата'?1:cat==='OSB'?3:cat==='LOGICPIR'?2:cat==='Техноплекс'?2:cat==='Профили'?6:cat==='Профиль ПВХ'?6:cat==='Подложка'?5:cat==='Сетка'?6:6;return '<img src="'+skinIcons[i]+'" alt="">'}
renderCats=function(){
 document.getElementById('catGrid').innerHTML=skinCats.map((c,i)=>`<div role="button" tabindex="0" class="mat-card${c===activeCat?' active':''}" onclick="setCat('${c}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setCat('${c}')}"><div class="mic">${skinIcon(c)}</div><span>${skinLabels[i]}</span></div>`).join('');
 document.getElementById('catSelect').innerHTML=cats.map(c=>`<option value="${c}"${c===activeCat?' selected':''}>${c==='Все'?'Все категории':c}</option>`).join('');
};
renderFleet=function(){document.getElementById('fleet').innerHTML=VEHICLES.map((v,i)=>`<div role="button" tabindex="0" class="truck-card${i===activeV?' active':''}" onclick="setV(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();setV(${i})}"><div class="truck-img-box"><img src="${skinTrucks[i]}" alt="Иллюстрация транспорта"></div><div class="truck-name">${v.name}</div><div class="truck-limit">${v.tons} · ${v.maxCbm} м³</div><div class="truck-rate">${v.rate} ₽/км</div></div>`).join('')};
const baseRenderOrder=renderOrder;
renderOrder=function(){baseRenderOrder();document.querySelectorAll('.cr-icon').forEach((el,i)=>{el.innerHTML=skinIcon(cart[i].product.cat)});const n=cart.length;document.getElementById('oCount').textContent=n+' '+(n%10===1&&n%100!==11?'товар':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'товара':'товаров')};
// Initial example uses existing product records, never fabricated picture totals.
cart=[{product:PRODUCTS.find(p=>p.id==='НФ-00000412'),qty:10},{product:PRODUCTS.find(p=>p.id==='НФ-00000305'),qty:15},{product:PRODUCTS.find(p=>p.id==='00-00003695'),qty:20}].filter(x=>x.product);
activeV=1;
document.getElementById('distance').value=248;
document.getElementById('searchBox').placeholder='Поиск по '+PRODUCTS.length+' материалам...';
renderCats();renderFleet();renderOrder();recalc();
document.getElementById('prodList').classList.remove('open');
document.getElementById('searchBox').addEventListener('focus',renderProds);
document.addEventListener('click',e=>{if(!e.target.closest('.materials'))document.getElementById('prodList').classList.remove('open')});
</script>
